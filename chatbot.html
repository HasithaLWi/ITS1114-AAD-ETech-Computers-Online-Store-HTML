<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1a73e8;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .api-key-bar {
            padding: 10px 16px;
            background: #e8f0fe;
            border-bottom: 1px solid #d0e1fd;
            display: flex;
            gap: 8px;
        }

        .api-key-bar input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #f1f3f4;
            color: #202124;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 12px 16px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
            background: #fff;
        }

        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 0.95rem;
        }

        .input-area button {
            padding: 10px 18px;
            border: none;
            background-color: #1a73e8;
            color: white;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background-color: #1557b0;
        }

        .input-area button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="header">Gemini AI Assistant</div>

        <!-- Input to enter API Key dynamically -->
        <div class="api-key-bar">
            <input type="password" id="apiKey" placeholder="Enter Gemini API Key (AIStudio)..." />
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">Hello! How can I help you today?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message..." onkeydown="handleKeyPress(event)" />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Chat history array to retain conversation context
        const contentsHistory = [];

        async function sendMessage() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const inputEl = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const messageText = inputEl.value.trim();

            if (!apiKey) {
                alert("Please enter your Gemini API Key at the top.");
                return;
            }

            if (!messageText) return;

            // 1. Render User Message in UI
            appendMessage(messageText, "user");
            inputEl.value = "";
            inputEl.disabled = true;
            sendBtn.disabled = true;

            // 2. Add message to context history
            contentsHistory.push({
                role: "user",
                parts: [{ text: messageText }]
            });

            // 3. Render placeholder Bot Message
            const botMsgDiv = appendMessage("Thinking...", "bot");

            try {
                // 4. Call Google Gemini REST API directly
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: contentsHistory,
                            systemInstruction: {
                                parts: [{ text: "You are a helpful and polite chatbot assistant." }]
                            }
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "Failed to fetch response");
                }

                // 5. Extract answer text from response
                const botResponseText = data.candidates[0].content.parts[0].text;

                // 6. Update UI & add to conversation history
                botMsgDiv.innerText = botResponseText;
                contentsHistory.push({
                    role: "model",
                    parts: [{ text: botResponseText }]
                });

            } catch (err) {
                botMsgDiv.innerText = "Error: " + err.message;
                // Remove bad entry from context history
                contentsHistory.pop();
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>

</body>

</html>
