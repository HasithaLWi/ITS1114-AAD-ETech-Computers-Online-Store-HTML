<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETech Assistant - AI Tech Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #080b12;
            color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 580px;
            background: #101722;
            border: 1px solid #202b3a;
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #0c111b;
            color: white;
            padding: 14px 16px;
            border-bottom: 1px solid #202b3a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header .title {
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .badge {
            font-size: 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 2px 6px;
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #60a5fa;
            border-radius: 4px;
            font-weight: 700;
        }

        .api-key-bar {
            padding: 8px 12px;
            background: #080b12;
            border-bottom: 1px solid #202b3a;
            display: flex;
            gap: 8px;
        }

        .api-key-bar input {
            flex: 1;
            padding: 6px 10px;
            background: #101722;
            border: 1px solid #202b3a;
            border-radius: 4px;
            outline: none;
            font-size: 0.75rem;
            color: #f4f7fb;
            font-family: 'JetBrains Mono', monospace;
        }

        .api-key-bar input:focus {
            border-color: #2563eb;
        }

        .chat-box {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #0c111b;
        }

        .message {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #141c28;
            color: #e2e8f0;
            border: 1px solid #202b3a;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            padding: 10px 12px;
            border-top: 1px solid #202b3a;
            display: flex;
            gap: 8px;
            background: #101722;
        }

        .input-area input {
            flex: 1;
            padding: 8px 12px;
            background: #080b12;
            border: 1px solid #202b3a;
            border-radius: 4px;
            outline: none;
            font-size: 0.82rem;
            color: #f4f7fb;
        }

        .input-area input:focus {
            border-color: #2563eb;
        }

        .input-area button {
            padding: 8px 16px;
            border: none;
            background-color: #2563eb;
            color: white;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background-color: #1d4ed8;
        }

        .input-area button:disabled {
            background-color: #202b3a;
            color: #718096;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="header">
            <div class="title">
                <span>ETech Assistant</span>
            </div>
            <span class="badge">ONLINE</span>
        </div>

        <div class="api-key-bar">
            <input type="password" id="apiKey" placeholder="Enter Gemini API Key (AIStudio)..." />
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">Hello! I am your ETech hardware assistant. How can I help you choose components or troubleshoot your setup today?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask about laptops, GPUs, monitors..." onkeydown="handleKeyPress(event)" />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const contentsHistory = [];

        async function sendMessage() {
            const apiKey = document.getElementById("apiKey").value.trim();
            const inputEl = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const messageText = inputEl.value.trim();

            if (!apiKey) {
                alert("Please enter your Gemini API Key at the top.");
                return;
            }

            if (!messageText) return;

            appendMessage(messageText, "user");
            inputEl.value = "";
            inputEl.disabled = true;
            sendBtn.disabled = true;

            contentsHistory.push({
                role: "user",
                parts: [{ text: messageText }]
            });

            const botMsgDiv = appendMessage("Thinking...", "bot");

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: contentsHistory,
                            systemInstruction: {
                                parts: [{ text: "You are E-T, an expert PC hardware and technology assistant for ETech Computers." }]
                            }
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "Failed to fetch response");
                }

                const botResponseText = data.candidates[0].content.parts[0].text;
                botMsgDiv.innerText = botResponseText;
                contentsHistory.push({
                    role: "model",
                    parts: [{ text: botResponseText }]
                });

            } catch (err) {
                botMsgDiv.innerText = "Error: " + err.message;
                contentsHistory.pop();
            } finally {
                inputEl.disabled = false;
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender);
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>

</body>

</html>
