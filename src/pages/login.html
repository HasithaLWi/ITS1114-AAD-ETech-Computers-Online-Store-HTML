<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Register - ETech Computers</title>
  <meta name="description"
    content="Log in or create an account with ETech Computers to complete purchases and track orders.">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Precision Design System Variables & Global Styles -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
</head>

<body
  class="bg-[#080b12] text-[#f4f7fb] flex flex-col min-h-screen font-sans antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#080b12]/92 border-b border-[#202b3a] text-white">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">

        <!-- Brand Logo -->
        <a href="../../index.html#home" class="flex items-center space-x-3 group">
          <div class="flex flex-col">
            <span class="text-xl font-extrabold tracking-tight text-[#f4f7fb]">
              ETech<span class="text-blue-500">Computers</span>
            </span>
            <span class="text-[10px] tracking-[0.2em] uppercase text-[#718096] font-semibold">Next-Gen Tech Store</span>
          </div>
        </a>

        <!-- Back to Shop Link -->
        <a href="../../index.html#shop"
          class="inline-flex items-center space-x-2 text-xs font-semibold text-[#a7b3c4] hover:text-white bg-[#101722] hover:bg-[#141c28] px-3.5 py-2 rounded-md border border-[#202b3a] hover:border-[#34445a] transition-all">
          <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          <span>Back to Store</span>
        </a>

      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden my-6">

    <!-- Background Ambient Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[300px] bg-blue-600/10 blur-[140px] rounded-full pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">

      <!-- Optional Redirect Alert Message -->
      <div id="redirect-banner"
        class="hidden mb-5 p-3.5 rounded-md bg-blue-950/40 border border-blue-500/30 text-blue-300 text-xs flex items-start space-x-2.5">
        <svg class="w-4 h-4 text-blue-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="redirect-banner-text">Sign up or log in to complete your checkout.</span>
      </div>

      <!-- Auth Card Container -->
      <div
        class="bg-[#101722] border border-[#202b3a] rounded-lg p-6 sm:p-8 shadow-2xl">

        <!-- Tab Navigation Switcher -->
        <div class="flex rounded-md bg-[#080b12] p-1 border border-[#202b3a] mb-6">
          <button id="tab-login-btn" onclick="switchTab('login')"
            class="flex-1 py-2 text-xs font-bold rounded transition-all text-white bg-blue-600 shadow-sm">
            Sign In
          </button>
          <button id="tab-signup-btn" onclick="switchTab('signup')"
            class="flex-1 py-2 text-xs font-bold rounded transition-all text-[#718096] hover:text-white">
            Create Account
          </button>
        </div>

        <!-- Alert Container for Errors/Success -->
        <div id="auth-alert"
          class="hidden mb-5 p-3 rounded-md text-xs font-medium border flex items-center space-x-2">
          <span id="auth-alert-text"></span>
        </div>

        <!-- ================= TAB 1: LOGIN FORM ================= -->
        <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-[#a7b3c4] uppercase tracking-wider mb-1">Email Address</label>
            <div class="relative">
              <input type="email" id="login-email" required placeholder="name@example.com"
                class="w-full px-3.5 py-2.5 rounded-md bg-[#080b12] border border-[#202b3a] text-white placeholder-[#718096] text-sm focus:border-blue-500 transition-colors">
              <svg class="w-4 h-4 text-[#718096] absolute right-3.5 top-3" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-semibold text-[#a7b3c4] uppercase tracking-wider">Password</label>
              <a href="#" onclick="alert('Password reset link has been sent to your email.')"
                class="text-xs text-blue-400 hover:underline">Forgot?</a>
            </div>
            <div class="relative">
              <input type="password" id="login-password" required placeholder="••••••••"
                class="w-full px-3.5 py-2.5 rounded-md bg-[#080b12] border border-[#202b3a] text-white placeholder-[#718096] text-sm focus:border-blue-500 transition-colors">
              <svg class="w-4 h-4 text-[#718096] absolute right-3.5 top-3 cursor-pointer hover:text-white"
                onclick="togglePasswordVisibility('login-password')" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center space-x-2 text-xs text-[#a7b3c4] cursor-pointer">
              <input type="checkbox" checked
                class="rounded bg-[#080b12] border-[#202b3a] text-blue-600 focus:ring-0 w-3.5 h-3.5">
              <span>Remember me</span>
            </label>
          </div>

          <button type="submit"
            class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-md shadow-sm transition-all">
            Sign In to Account
          </button>
        </form>

        <!-- ================= TAB 2: SIGNUP FORM ================= -->
        <form id="signup-form" onsubmit="handleSignupSubmit(event)" class="hidden space-y-4">
          <div>
            <label class="block text-xs font-semibold text-[#a7b3c4] uppercase tracking-wider mb-1">Full Name *</label>
            <input type="text" id="signup-name" required placeholder="John Doe"
              class="w-full px-3.5 py-2.5 rounded-md bg-[#080b12] border border-[#202b3a] text-white placeholder-[#718096] text-sm focus:border-blue-500 transition-colors">
          </div>

          <div>
            <label class="block text-xs font-semibold text-[#a7b3c4] uppercase tracking-wider mb-1">Email Address *</label>
            <input type="email" id="signup-email" required placeholder="name@example.com"
              class="w-full px-3.5 py-2.5 rounded-md bg-[#080b12] border border-[#202b3a] text-white placeholder-[#718096] text-sm focus:border-blue-500 transition-colors">
          </div>

          <div>
            <label class="block text-xs font-semibold text-[#a7b3c4] uppercase tracking-wider mb-1">Password *</label>
            <div class="relative">
              <input type="password" id="signup-password" required minlength="6" placeholder="Min. 6 characters"
                class="w-full px-3.5 py-2.5 rounded-md bg-[#080b12] border border-[#202b3a] text-white placeholder-[#718096] text-sm focus:border-blue-500 transition-colors">
              <svg class="w-4 h-4 text-[#718096] absolute right-3.5 top-3 cursor-pointer hover:text-white"
                onclick="togglePasswordVisibility('signup-password')" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-[#a7b3c4] uppercase tracking-wider mb-1">Confirm Password *</label>
            <input type="password" id="signup-confirm-password" required placeholder="Repeat password"
              class="w-full px-3.5 py-2.5 rounded-md bg-[#080b12] border border-[#202b3a] text-white placeholder-[#718096] text-sm focus:border-blue-500 transition-colors">
          </div>

          <div class="pt-1">
            <label class="flex items-start space-x-2 text-xs text-[#718096] cursor-pointer">
              <input type="checkbox" required
                class="rounded bg-[#080b12] border-[#202b3a] text-blue-600 focus:ring-0 w-3.5 h-3.5 mt-0.5">
              <span>I agree to ETech Store terms, warranty conditions & privacy policy.</span>
            </label>
          </div>

          <button type="submit"
            class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-md shadow-sm transition-all">
            Create Account & Sign In
          </button>
        </form>

      </div>

      <p class="text-center text-xs text-[#718096] mt-6">
        &copy; 2026 ETech Computers Inc. Safe 256-bit SSL Auth System.
      </p>

    </div>
  </main>

  <script type="module" src="../../script.js"></script>
  <!-- E-T AI Chatbot -->
  <script src="../js/controller/chatbot_controller.js"></script>
</body>

</html>
